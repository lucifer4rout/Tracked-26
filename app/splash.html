<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tracked 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="splash.css">
</head>
<body>
  <div class="splash-card">
    <div class="splash-brand">
      <span class="splash-brand-mark">Tracked.</span>
      <span class="splash-brand-year">26</span>
    </div>

    <div class="splash-spinner" id="splashSpinner"></div>

    <div class="splash-status" id="splashStatus">Starting up…</div>

    <div class="splash-progress-track" id="splashProgressTrack" hidden>
      <div class="splash-progress-fill" id="splashProgressFill"></div>
    </div>
  </div>

  <script src="splash.js"></script>
</body>
</html>
